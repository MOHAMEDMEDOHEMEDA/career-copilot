[project]
name = "career-copilot-backend"
version = "0.1.0"
description = "Backend API for Career Copilot AI"
readme = "README.md"
authors = [
    { name = "MOHAMEDMEDOHEMEDA", email = "94225644+MOHAMEDMEDOHEMEDA@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.11.0",
]

[project.scripts]
career-copilot-backend = "career_copilot_backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
