services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://career_copilot:career_copilot@db:5432/career_copilot
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: career_copilot
      POSTGRES_USER: career_copilot
      POSTGRES_PASSWORD: career_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_copilot -d career_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
