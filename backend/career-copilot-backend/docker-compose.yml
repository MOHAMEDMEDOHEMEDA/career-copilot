services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://career_copilot:career_copilot@db:5432/career_copilot
      JWT_SECRET: ${JWT_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REVIEWED_TECHNICAL_SOURCE_IDS: ${REVIEWED_TECHNICAL_SOURCE_IDS:-}
      ADAPTIVE_INTERVIEW_LIMIT_PER_HOUR: ${ADAPTIVE_INTERVIEW_LIMIT_PER_HOUR:-30}
      GOOGLE_SERVER_CLIENT_ID: ${GOOGLE_SERVER_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    depends_on:
      db:
        condition: service_healthy
  worker:
    profiles: ["analysis"]
    build: .
    command: ["python", "-m", "career_copilot_backend.services.analysis_jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://career_copilot:career_copilot@db:5432/career_copilot
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_INPUT_USD_PER_MILLION: ${GEMINI_INPUT_USD_PER_MILLION:-}
      GEMINI_OUTPUT_USD_PER_MILLION: ${GEMINI_OUTPUT_USD_PER_MILLION:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      ADAPTIVE_MAX_FOLLOWUPS: ${ADAPTIVE_MAX_FOLLOWUPS:-2}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REVIEWED_TECHNICAL_SOURCE_IDS: ${REVIEWED_TECHNICAL_SOURCE_IDS:-}
      KNOWLEDGE_HYBRID_ENABLED: ${KNOWLEDGE_HYBRID_ENABLED:-false}
      KNOWLEDGE_VECTOR_MAX_DISTANCE: ${KNOWLEDGE_VECTOR_MAX_DISTANCE:-0.35}
      KNOWLEDGE_KEYWORD_MAX_DISTANCE: ${KNOWLEDGE_KEYWORD_MAX_DISTANCE:-0.55}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: career_copilot
      POSTGRES_USER: career_copilot
      POSTGRES_PASSWORD: career_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_copilot -d career_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
